name: enjoy
description: "ENJOY — One App. One Account. One Ecosystem."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.8.0

  # Auth
  google_sign_in: ^7.1.0

  # Network
  connectivity_plus: ^6.1.0
  app_links: ^6.3.2
  http: ^1.2.2

  # Config & Storage
  flutter_dotenv: ^5.2.1
  shared_preferences: ^2.3.2

  # Notifications
  flutter_local_notifications: ^17.2.3
  permission_handler: ^11.3.1

  # Media
  image_picker: ^1.2.0
  file_picker: ^8.1.4
  video_player: ^2.9.2
  cached_network_image: ^3.4.1
  dio: ^5.7.0
  gal: ^2.3.0
  ffmpeg_kit_flutter_new: ^1.0.5
  record: ^5.1.0

  # Ads
  google_mobile_ads: ^5.1.0

  # Utils
  share_plus: ^10.0.2
  timeago: ^3.7.0
  path_provider: ^2.1.4
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo/enjoy_logo.png